<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feral to Kings - Top-Down SNES Adventure</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0d12;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #141824;
      border: 4px solid #3b82f6;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      padding: 10px;
    }
    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background-color: #000;
      display: block;
      border: 2px solid #1e293b;
    }
    .controls-hint {
      margin-top: 8px;
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="1024" height="704"></canvas>
    <div class="controls-hint">
      [WASD / Arrows] Move | [J / Space] Sword | [K] Use Item | [1-9 / Q / E] Change Item | [I] Inventory | [F5/F9] Save/Load
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
